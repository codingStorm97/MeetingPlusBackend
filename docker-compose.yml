services:
  # Vector DB (Qdrant)
  qdrant:
    image: qdrant/qdrant
    container_name: meetingsplus-qdrant
    ports:
      - "9020:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meetingsplus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Anubhab*1997"
    ports:
      - "9000:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: meetingsplus-redis
    ports:
      - "9070:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: meetingsplus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: meetingsplus-kafka
    depends_on:
      - zookeeper
    ports:
      - "9050:9050"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9050
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9050
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  akhq:
    image: tchiotludo/akhq:latest
    container_name: meetingsplus-akhq
    depends_on:
      - kafka
    ports:
      - "9051:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            meetingsplus:
              properties:
                bootstrap.servers: "kafka:9092"

  ollama:
    image: ollama/ollama:latest
    container_name: meetingsplus-ollama
    ports:
      - "9040:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  ollama-init:
    image: ollama/ollama:latest
    container_name: meetingsplus-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      [
        "sh",
        "-c",
        "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull nomic-embed-text"
      ]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    restart: "no"

  huggingface-mcp:
    build:
      context: .
      dockerfile: AiTodoApp.HuggingFaceMcp/Dockerfile
    container_name: meetingsplus-huggingface-mcp
    depends_on:
      - redis
    ports:
      - "9090:9090"
    environment:
      ASPNETCORE_URLS: "http://+:9090"
      HF_API_KEY: "${HF_API_KEY}"
      Redis__ConnectionString: "redis:6379"
      HuggingFace__Model: "MiniMaxAI/MiniMax-M2.7:novita"
      HuggingFace__Endpoint: "https://router.huggingface.co/v1/chat/completions"
      HuggingFace__MaxNewTokens: "256"
    entrypoint:
      [
        "sh",
        "-c",
        "echo 'Tools URL: http://localhost:9090/api/tools' && echo 'Health URL: http://localhost:9090/health' && dotnet AiTodoApp.HuggingFaceMcp.dll"
      ]
    restart: unless-stopped

volumes:
  qdrant_storage:
  sqlserver_data:
  ollama_data:
